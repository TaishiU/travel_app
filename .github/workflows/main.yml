name: Flutter CI

on:
  push:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'widgetbook/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'analysis_options.yaml'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@v5

      - name: Flutterのセットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pubキャッシュの復元
        uses: actions/cache@v5
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: 依存関係を取得
        run: flutter pub get

      - name: widgetbookの依存関係を取得
        run: cd widgetbook && flutter pub get

      - name: フォーマット確認
        run: dart format --output=none --set-exit-if-changed .

      - name: Flutter静的解析
        run: flutter analyze

      - name: widgetbook静的解析
        run: cd widgetbook && dart analyze

  test:
    runs-on: ubuntu-latest
    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@v5

      - name: Flutterのセットアップ
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pubキャッシュの復元
        uses: actions/cache@v5
        with:
          path: ${{ env.PUB_CACHE }}
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: 依存関係を取得
        run: flutter pub get

      - name: テスト実行
        run: flutter test

  notify:
    runs-on: ubuntu-latest
    needs: [ analyze, test ]
    if: always()
    steps:
      - name: Slack通知
        uses: slackapi/slack-github-action@v3.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: "*GitHub Action build result*: analyze=${{ needs.analyze.result == 'success' && ':white_check_mark:' || ':x:' }} ${{ needs.analyze.result }} / test=${{ needs.test.result == 'success' && ':white_check_mark:' || ':x:' }} ${{ needs.test.result }}\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}"
            blocks:
              - type: "section"
                text:
                  type: "mrkdwn"
                  text: "GitHub Action build result: analyze=${{ needs.analyze.result == 'success' && ':white_check_mark:' || ':x:' }} ${{ needs.analyze.result }} / test=${{ needs.test.result == 'success' && ':white_check_mark:' || ':x:' }} ${{ needs.test.result }}\n${{ github.event.pull_request.html_url || github.event.head_commit.url }}"
